# Evolve Chat (rebranded Element X) build: compiles for the iOS Simulator on GitHub's macOS runners, launches the
# app and captures the first screen, so the heavy build never runs on the production Mac Mini. Element's own CI
# workflows were removed in this fork; they target Element's infrastructure and secrets.
name: Evolve Chat build

on:
  push:
    branches: [evolve]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Evolve brand guard (seconds; before the long build)
        run: bash Tools/Scripts/evolve-brand-guard.sh
      - name: Select Xcode (same as upstream CI)
        run: sudo xcode-select -s /Applications/Xcode_26.5.0.app && xcodebuild -version
      - name: Tools
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      # Derived data must live outside the checkout: the ElementX build phase runs `swiftformat --lint` over the
      # whole project dir and fails on the downloaded packages (sentry-cocoa, swift-syntax) if they sit inside it.
      # Ad-hoc signing (CODE_SIGN_IDENTITY=-), never CODE_SIGNING_ALLOWED=NO: unsigned builds lose the keychain
      # entitlement, AppLockService.isEnabled catches the keychain error and the app opens on the PIN lock screen.
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ElementX.xcodeproj -scheme ElementX -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- build | tail -40
      - name: Launch and screenshot
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"; /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist"
          # Simulator builds carry their entitlements in the binary's __TEXT,__entitlements section, not the signature.
          strings -a "$APP/ElementX" | grep -A3 -E '<key>(keychain-access-groups|com.apple.security.application-groups)</key>' | head -12 || true
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 17 \(' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$DEV" "$BID"; sleep 25
          mkdir -p shots; xcrun simctl io "$DEV" screenshot shots/01-launch.png
          xcrun simctl ui "$DEV" appearance dark; sleep 5; xcrun simctl io "$DEV" screenshot shots/02-launch-dark.png
          cp -R "$APP" shots/ && (cd shots && zip -qr EvolveChat-simulator.app.zip "$(basename "$APP")" && rm -rf "$(basename "$APP")")
      # Only the suites that cover what this fork changes (settings, start screen, home banners, encryption
      # switches); Element's full suite runs upstream.
      - name: Unit tests for the fork's changes
        run: |
          set +e
          xcodebuild test -project ElementX.xcodeproj -scheme UnitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:UnitTests/AppSettingsTests \
            -only-testing:UnitTests/AuthenticationStartScreenViewModelTests \
            -only-testing:UnitTests/HomeScreenViewModelTests \
            -only-testing:UnitTests/SecurityAndPrivacyScreenViewModelTests \
            CODE_SIGN_IDENTITY=- > "$RUNNER_TEMP/unit-tests.log" 2>&1
          status=$?
          grep -E 'Test (Suite|Case|run)|✔|✘|passed|failed|error:|\*\* TEST' "$RUNNER_TEMP/unit-tests.log" | tail -80
          [ "$status" -eq 0 ] || tail -40 "$RUNNER_TEMP/unit-tests.log"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolve-chat-simulator
          path: shots/
